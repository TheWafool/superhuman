# Builds and tests on all three systems; tagged pushes (v*) attach the binaries to a release.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-dev
        if: runner.os == 'Linux'
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: superman-${{ runner.os }}
          path: |
            target/release/superman-frontend
            target/release/superman-frontend.exe
