# Flatpak manifest (untested). Games run on the host, so the sandbox needs --talk-name=org.freedesktop.Flatpak
# or flatpak-spawn --host; until that is sorted, prefer the native packages.
app-id: org.superhuman.Frontend
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions: [org.freedesktop.Sdk.Extension.rust-stable]
command: superhuman
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all
  - --filesystem=home:ro
  - --talk-name=org.freedesktop.Flatpak
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/superhuman/cargo
modules:
  - name: superhuman
    buildsystem: simple
    build-commands:
      - cargo build --release --offline
      - install -Dm755 target/release/superhuman /app/bin/superhuman
      - install -Dm644 dist/superhuman.desktop /app/share/applications/org.superhuman.Frontend.desktop
      - sed -i 's/^Icon=.*/Icon=org.superhuman.Frontend/' /app/share/applications/org.superhuman.Frontend.desktop
      - install -Dm644 dist/superhuman.png /app/share/icons/hicolor/512x512/apps/org.superhuman.Frontend.png
    sources:
      - type: dir
        path: ../..
      - cargo-sources.json
