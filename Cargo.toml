[package]
name = "superman-frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
gilrs = "0.11"
iced = { version = "0.14", features = ["tokio", "image", "advanced"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.13", features = ["json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["fs", "rt", "time"] }
toml = "1.2.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

# `cargo deb` and `cargo generate-rpm` (see .github/workflows/release.yml)
[package.metadata.deb]
section = "games"
depends = "$auto, libxkbcommon0, libudev1"
recommends = "gamescope, umu-launcher"
assets = [
    ["target/release/superman-frontend", "usr/bin/", "755"],
    ["dist/superman-session", "usr/bin/", "755"],
    ["dist/superman.desktop", "usr/share/applications/", "644"],
    ["dist/superman-session.desktop", "usr/share/wayland-sessions/superman.desktop", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/superman-frontend", dest = "/usr/bin/superman-frontend", mode = "755" },
    { source = "dist/superman-session", dest = "/usr/bin/superman-session", mode = "755" },
    { source = "dist/superman.desktop", dest = "/usr/share/applications/superman.desktop", mode = "644" },
    { source = "dist/superman-session.desktop", dest = "/usr/share/wayland-sessions/superman.desktop", mode = "644" },
]
